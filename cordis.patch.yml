# The @argszero/cordis-plugin-length-stop-overflow bundle patch.
# Mounting needs no configuration: mode='error' by default. All three triggers
# below are on by default; 'warn' reports without changing behaviour, 'off'
# disables.
#
#   - set:
#       - id: length-stop-overflow
#         config:
#           mode: error                  # error | warn | off
#           atMostOutputTokens: 2        # raise it if your backend clamps to a
#                                        # small positive remainder instead of 1
#           classifyOversizeRequests: true   # 413 / size-wording refusals
#           classifySaturatedFailures: true  # window-full prompts, unnamed
#           saturationRatio: 0.99            # how full counts as full
#
# What it guards (discussion #7214). A provider can answer "your request was too
# large" without failing: it truncates and says `finish_reason: "length"`, which
# `dsh-llm` maps to `{ kind: 'max-tokens' }` — an ordinary output cap, and a
# sticky terminal turn end with no recovery hook.
#
# The reported session ended turns with ONE output token, forever. The one token
# is not the provider's choice:
#
#   llm-pi-ai/src/adapter.ts:380  -> pi-ai streamSimple
#   @earendil-works/pi-ai/dist/api/simple-options.js:2-9
#     const available = model.contextWindow - estimateContextTokens(context).tokens - 4096
#     return Math.min(maxTokens, Math.max(1 /* MIN_MAX_TOKENS */, available))
#
# Past the window dsh *believes* in, the budget is clamped to its floor of 1 and
# dsh really sends `max_tokens: 1`. The provider answers `length` after one
# token, correctly. pi-ai's own overflow sniff then requires exactly ZERO output
# (dist/utils/overflow.js:149) — the floor of one is what keeps the count off it
# — and llm-pi-ai falls through to `case 'length': { kind: 'max-tokens' }`
# (stream.ts:109).
#
# Two guards then miss, for opposite reasons: REPETITION-based loop detectors see
# a different one-token answer each time (it is a valid prefix estimate, neither
# aborted nor error, so the next request re-sends the same over-long prompt), and
# the pressure threshold that would trigger compaction is computed from a window
# the provider does not share (see discussion #7213).
#
# The overflow recovery built for this situation is gated on a code nothing on
# this path produces:
#
#   compaction-basic/src/index.ts:180
#     if (failure.code !== CONTEXT_WINDOW_EXCEEDED_CODE || signal.aborted) return next()
#
# mode='error' rewrites the truncating finish into that code, so the loop routes
# it to agent/request-error (agent-loop/src/agent.ts:445-464) and
# @deepseek-ai/dsh-compaction-basic — mounted in bundle/base and bundle/web-app —
# compacts and returns { kind: 'retry' }, bounded by its maxOverflowRetries
# (default 1; compaction-basic/src/config.ts:93), so there is no retry loop.
#
# On an `error` finish the loop settles only `assistant/attempt`
# (agent-loop/src/agent.ts:445-448) and never appends `assistant/message`, so the
# degenerate one-token answer does not enter the derived conversation — the
# compaction summarizes a history without it.
#
# The verdict is window-independent: a `max-tokens` finish with a negligible
# output count is a truncation of *our* request by construction, because the real
# output cap is the model's own (tens of thousands of tokens in the catalog). A
# finish that carries no `usage` chunk is left alone (fail-closed).
#
# What it guards, the second (discussion #7626). A session can also grow past
# the provider's *transport* limit, in bytes, while every budget dsh computes
# still reports headroom: dsh prices a request in tokens and never in bytes, and
# the only byte budget in the LLM layer prices images. The provider then refuses
# the request outright — HTTP 413 — and the classification order turns that into
# the wrong code (llm-deepseek/src/transport.ts:31-33): a body-less 413 carries no
# wording for isContextWindowExceededError to read, so the fallback string
# 'DeepSeek Messages request failed (413)' falls through to INVALID_REQUEST.
#
#   compaction-basic/src/index.ts:180
#     if (failure.code !== CONTEXT_WINDOW_EXCEEDED_CODE || signal.aborted) return next()
#
# Nothing recovers from INVALID_REQUEST — it is not in DEFAULT_RETRYABLE_CODES
# (llm/src/retry-policy.ts:18-24), so the repeated 413s are re-issued turns — and
# the summarization call that was supposed to reduce the session replays the same
# oversized region and is refused too, so the session cannot send anything again.
#
# The second trigger reads size evidence instead of the code: the status itself,
# the literal '413' in the failure text, or size wording on a request-rejection
# code. INVALID_REQUEST holds malformed, forbidden and oversized requests
# together, so the wording has to name size *and* name the request — a size
# complaint about an image belongs to @deepseek-ai/dsh-compaction-image-offload,
# and an 'aborted' finish is the caller's own decision, never a provider verdict.
#
# Where the summarization request is itself over the limit, no classification can
# rescue the session; what changes is the label and the message (the provider's
# own words, the status, the request id, and the measured size of the message
# array). Where the region fits, the built-in recovery runs and the session
# continues.
#
# What it guards, the third (discussion #7632). A provider can also refuse a
# request for its length while naming nothing: the answer is an `error` finish
# whose code ends at PI_AI_ERROR, and no wording matches the text fallback
# (llm/src/error.ts:51-85), so the recovery gate above never runs and the session
# repeats the same over-long request. A usage-based sniff for exactly this exists
# upstream and is one conjunct short — pi-ai's isContextOverflow gates its usage
# branch on `message.stopReason === "stop"`
# (pi-ai/dist/utils/overflow.js:140-145), while this answer carries "error".
#
# What is left is the provider's own arithmetic: it counted this request's prompt
# tokens (inputTokens + cacheReadTokens + cacheWriteTokens) against the window the
# route advertises, resolved at the llm/stream seam through
# ctx.llm.resolveModelInfo(...).context.contextWindow. Reaching saturationRatio
# (default 0.99) of that window, on a failure nothing else attributed, is an
# overflow the harness could not name. The synthesized failure keeps the
# provider's message verbatim and adds both numbers, so the rewrite is checkable
# against the session log.
#
# The window lookup is the only input that costs a call, so the wiring asks for
# it only after both other rules declined the finish AND the failure alone passed
# every window-independent gate; a healthy turn never pays for it. A resolver that
# throws leaves the stream untouched — the guard may not become a new way for a
# turn to fail, and the alternatives (assume a window, trust a usage chunk that
# never arrived) would claim failures this plugin cannot substantiate.
#
# Start with mode='warn' to measure how often your own traffic hits any trigger
# before letting it change behaviour.

- insert:
    - id: length-stop-overflow
      name: '@argszero/cordis-plugin-length-stop-overflow'
